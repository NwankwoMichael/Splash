    <style>
      /* GENERAL SETTINGS */
      :root {
        --primary-color: #ffd700;
        --tinted-primary: #e6c200;
        --light-tint: #b39700;
        --secondary-color: #332b00;
        --tertiary-color: #4c4000;
        --main-background: #fffbe6;
        --shade-primary: #fff7cc;
        --lighter-shade: #fff7cc;
        --white-color: #fff;
      }

      html {
        font-size: 62.5%;
        overflow-x: hidden;
        scroll-behavior: smooth;
        font-family: "Rubik", sans-serif;
        line-height: 1;
        font-weight: 400;
        color: var(--tertiary-color);
      }

      body {
        max-width: 100%;
      }

      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        transition: all 500ms;
      }

      /* REUSABLE CLASSES */
      .container {
        max-width: 120rem;
        margin: 0 auto;
      }

      .primary-heading {
        font-size: 4.4rem;
      }

      .center-text {
        text-align: center;
      }

      .grid {
        display: grid;
      }

      .grid--4-cols {
        grid-template-columns: repeat(4, 1fr);
      }

      .flex {
        display: flex;
      }

      .btn--small {
        padding: 1rem 2.4rem;
        background: var(--light-tint);
        font-weight: 500;
        border-radius: 0.9rem;
      }

      /* HEADER STYLING */

      .header {
        padding: 4.4rem 3.2rem 4.8rem 5.2rem;
        background-color: var(--white-color);
      }

      .header h1 {
        margin: 9.6rem;
      }

      .nav-list {
        gap: 1.6rem;
        list-style: none;
      }

      .nav-item .nav-link:link,
      .nav-item .nav-link:visited {
        text-decoration: none;
        font-size: 2.4rem;
        color: var(--tertiary-color);
      }

      .nav-item .nav-link:hover,
      .nav-item .nav-link:active {
        background: var(--tinted-primary);
        color: var(--lighter-shade);
      }

      /* MAIN STYLING */
      .gallery {
        align-items: center;
        justify-items: center;
        gap: 1.2rem;
      }

      .image-box {
        overflow: hidden;
        position: relative;
        z-index: 3;
      }

      .image {
        width: 30rem;
        height: 30rem;
        z-index: 1;
      }

      .image:hover {
        transform: scale(1.2);
      }

      .image-caption {
        font-size: 1.8rem;
        font-style: italic;
        font-weight: 500;
        color: var(--lighter-shade);
        opacity: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        background: rgba(0, 0, 0, 0.2);
        z-index: 2;
      }

      .image-box:hover .image-caption {
        opacity: 100;
      }

      .box {
        justify-content: center;
        align-items: center;
        gap: 1.2rem;
      }

      .interpage:link,
      .interpage:visited {
        text-decoration: none;
        font-size: 1.8rem;
        text-transform: uppercase;
        font-weight: 500;
        color: var(--secondary-color);
        border-bottom: 0.2rem solid var(--light-tint);
        margin-left: auto;
      }

      .interpage:hover,
      .interpage:active {
        border: none;
      }

      .interpage-icon {
        font-size: 3rem;
      }

      /* MEDIA QUERIES */

      /* ********************** */
      /*BELOW 1232px /*
      /* ********************** */
      @media (max-width: 77em) {
        .gallery {
          grid-template-columns: repeat(3, 1fr);
          column-gap: 0;
        }

        .image {
          width: 25rem;
          height: 25rem;
        }
      }

      /* ********************** */
      /*BELOW 920px /*
      /* ********************** */
      @media (max-width: 57.5em) {
        html {
          font-size: 56.25%;
        }

        .primary-heading {
          font-size: 3.6rem;
        }

        .nav-item .nav-link:link,
        .nav-item .nav-link:visited {
          font-size: 2rem;
        }

        .btn--small {
          padding: 0.8rem 2rem;
        }
      }
      .interpage-icon {
        font-size: 2.4rem;
      }

      .interpage:link,
      .interpage:visited {
        font-size: 1.6rem;
      }

      /* ********************** */
      /*BELOW 723px /*
      /* ********************** */
      @media (max-width: 45.2em) {
        html {
          font-size: 50%;
        }

        .primary-heading {
          font-size: 3rem;
        }

        .nav-item .nav-link:link,
        .nav-item .nav-link:visited {
          font-size: 2rem;
        }

        .btn--small {
          padding: 0.6rem 1.8rem;
        }

        .interpage-icon {
          font-size: 1.8rem;
        }

        .interpage:link,
        .interpage:visited {
          font-size: 1.4rem;
        }

        .image {
          width: 20rem;
          height: 20rem;
        }
      }

      /* ********************** */
      /*BELOW 572px /*
      /* ********************** */
      @media (max-width: 35.8em) {
        html {
          font-size: 43.6%;
        }

        .primary-heading {
          font-size: 2.4rem;
        }

        .interpage-icon {
          font-size: 1.8rem;
        }

        .interpage:link,
        .interpage:visited {
          font-size: 1.2rem;
        }
      }

      /* ********************** */
      /*BELOW 447px /*
      /* ********************** */
      @media (max-width: 27.93em) {
        html {
          font-size: 37.5%;
        }

        .primary-heading {
          font-size: 2rem;
          color: var(--secondary-color);
        }

        .interpage:link,
        .interpage:visited {
          color: var(--main-background);
        }
      }
    </style>
